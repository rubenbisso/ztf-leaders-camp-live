[build]
  publish = "public"
  functions = "netlify/functions"
  # Bring the database up to date with the code being deployed. Without this
  # the schema is only applied by calling /api/migrate by hand, and forgetting
  # it takes the whole form down with an unreadable 500.
  command = "node netlify/build-migrate.mjs"

[functions]
  node_bundler = "esbuild"
  # schema.sql is read at runtime by migrate.mjs, so it must be bundled
  # alongside the function. esbuild only ships JS unless told otherwise.
  included_files = ["netlify/functions/schema.sql"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
